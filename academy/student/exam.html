<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Exam | ISSA Academy</title>

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/student/exam.css">

</head>

<body>

<div class="exam-wrapper">

<header class="exam-header">

<div>

<h2 id="examTitle">

Loading Exam...

</h2>

<p id="examInfo">

Question

<span id="currentQuestion">

1

</span>

/

<span id="totalQuestions">

0

</span>

</p>

</div>

<div class="timer-box">

<i class="fa-solid fa-clock"></i>

<span id="timer">

30:00

</span>

</div>

</header>

<div class="progress">

<div
id="progressBar"
class="progress-bar">

</div>

</div>

<div class="exam-body">

<div class="question-area">

<h3 id="questionText">  

Loading...

</h3>

<div
    id="questionAttachment"
    class="question-attachment hidden">
</div>

<div
id="optionsList"
class="options-list">

</div>

</div>

<aside class="question-palette">

<h4>

Questions

</h4>

<div
id="palette"
class="palette">

</div>

</aside>

</div>

<div class="exam-footer">

<button
id="previousBtn"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Previous

</button>

<button
id="nextBtn"
class="btn btn-primary">

Next

<i class="fa-solid fa-arrow-right"></i>

</button>

<button
id="submitBtn"
class="btn btn-success hidden">

<i class="fa-solid fa-check"></i>

Finish Exam

</button>

</div>

</div>

<div id="pageLoader" class="page-loader hidden">
  <div class="loader-card">
    <img 
      src="../assets/images/Issa-Logo.png" 
      alt="ISSA Academy Logo" 
      style="width: 120px; max-width: 100%; height: auto;"
    >
    <div class="loader-spinner"></div>
    <p>Microsoft Excel Module Exam</p>
  </div>
</div>

<div
id="toastContainer"
class="toast-container">

</div>

<script
type="module"
src="../assets/js/student/exam.js">

</script>

</body>

</html>
