<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login | ISSA Academy</title>

    <meta name="theme-color"
          content="#2563EB">

    <link rel="icon"
          href="../assets/images/Issa-Logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../assets/css/main.css">

    <link rel="stylesheet"
          href="../assets/css/student/login.css">

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="logo-area">

            <img
                src="../assets/images/Issa-Logo.png"
                alt="ISSA Academy">

            <h1>

                Student Login

            </h1>

            <p>

                Welcome back to ISSA Academy

            </p>

        </div>

        <form
            id="loginForm"
            novalidate>

            <div class="form-group">

                <label>

                    Email Address

                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Password

                </label>

                <div class="password-box">

                    <input
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        class="password-toggle">

                        <i class="fa-solid fa-eye"></i>

                    </button>

                </div>

            </div>

            <div class="login-options">

                <label class="remember-me">

                    <input
                        id="rememberMe"
                        type="checkbox">

                    Remember Me

                </label>

                <a
                    href="forgot-password.html">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="btn btn-primary login-btn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>

        </form>

        <div class="register-link">

            Don't have an account?

            <a href="register.html">

                Register Here

            </a>

        </div>

    </div>

</div>

<div
    id="pageLoader"
    class="page-loader hidden">

    <div class="loader-card">

        <img
            src="../assets/images/Issa-Logo.png"
            alt="ISSA Academy"
            class="loader-logo">

        <div class="loader-spinner"></div>

        <p>

            Signing In...

        </p>

    </div>

</div>

<div
    id="toastContainer"
    class="toast-container">

</div>

<script
    type="module"
    src="../assets/js/student/login.js">

</script>

</body>

</html>
