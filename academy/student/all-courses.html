<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Courses | ISSA Academy</title>
    <meta name="theme-color" content="#2563EB">
    <link rel="icon" href="../assets/images/Issa-Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/student/my-courses.css">
    <link rel="stylesheet" href="../assets/css/student/all-courses.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">
        <button class="sidebar-close" aria-label="Close Sidebar">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="logo-area">
            <img src="../assets/images/Issa-Logo.png" alt="ISSA Academy">
            <h2>ISSA Academy</h2>
        </div>
        <nav>
            <ul>
                <li>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-house"></i>
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="my-courses.html">
                        <i class="fa-solid fa-book-open"></i>
                        My Courses
                    </a>
                </li>

                <li class="active">
                    <a href="all-courses.html">
                        <i class="fa-solid fa-compass"></i>
                        Explore Courses
                    </a>
                </li>
                <li>
                    <a href="profile.html">
                        <i class="fa-solid fa-user"></i>
                        My Profile
                    </a>
                </li>
                <li>
                    <a href="certificates.html">
                        <i class="fa-solid fa-award"></i>
                        View Certificate
                    </a>
                </li>
                <li>
                    <a href="login.html" id="logoutBtn">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </a>
                </li>
            </ul>
        </nav>
    </aside>

    <main class="content">

        <!-- Mobile Header Bar -->
        <div class="mobile-header-bar">
            <button type="button" class="mobile-menu-btn" id="menu-toggle">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span class="mobile-brand-title">ISSA Academy</span>
        </div>

        <header class="top-bar">
            <div>
                <h1>Explore Courses</h1>
                <p>Browse and discover all available courses at ISSA Academy.</p>
            </div>
        </header>

        <!-- ================= Course Grid Container ================= -->
        <div id="allCoursesGrid" class="grid-3">
            <!-- Dynamic courses will load here -->
        </div>

    </main>

</div>

<div id="pageLoader" class="page-loader hidden">
    <div class="loader-card">
        <img src="../assets/images/Issa-Logo.png" alt="ISSA Academy" class="loader-logo">
        <div class="loader-spinner"></div>
        <p>Loading Courses...</p>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<!-- Sidebar Overlay for Mobile View -->
<div class="sidebar-overlay"></div>

<script type="module" src="../assets/js/student/student-sidebar.js"></script>
<script type="module" src="../assets/js/student/all-courses.js"></script>

<!-- Inline Mobile Toggle Initialization Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.sidebar-overlay');
        const closeBtn = document.querySelector('.sidebar-close');
        const hamburgerBtn = document.querySelector('#menu-toggle');

        if (hamburgerBtn) {
            hamburgerBtn.addEventListener('click', () => {
                sidebar.classList.add('open');
                overlay.classList.add('show');
            });
        }

        const closeSidebar = () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        };

        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
        if (overlay) overlay.addEventListener('click', closeSidebar);
    });
</script>

</body>

</html>
