<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | ISSA Academy</title>

    <meta name="theme-color"
          content="#2563EB">

    <link rel="icon"
          href="../assets/images/Issa-Logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../assets/css/main.css">

    <link rel="stylesheet"
          href="../assets/css/student/forgot-password.css">

</head>

<body>

<div class="forgot-page">

    <div class="forgot-card">

        <div class="logo-area">

            <img
                src="../assets/images/Issa-Logo.png"
                alt="ISSA Academy">

            <h1>

                Forgot Password

            </h1>

            <p>

                Enter your registered email address.

            </p>

        </div>

        <form
            id="forgotForm">

            <div class="form-group">

                <label>

                    Email Address

                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Enter your registered email"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary reset-btn">

                <i class="fa-solid fa-paper-plane"></i>

                Send Reset Link

            </button>

        </form>

        <div class="back-link">

            <a href="login.html">

                <i class="fa-solid fa-arrow-left"></i>

                Back to Login

            </a>

        </div>

    </div>

</div>

<div
    id="pageLoader"
    class="page-loader hidden">

    <div class="loader-card">

        <img
            src="../assets/images/Issa-Logo.png"
            alt="ISSA Academy"
            class="loader-logo">

        <div class="loader-spinner"></div>

        <p>

            Sending Reset Link...

        </p>

    </div>

</div>

<div
    id="toastContainer"
    class="toast-container">

</div>

<script
    type="module"
    src="../assets/js/student/forgot-password.js">

</script>

</body>

</html>
