<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Settings | ISSA Academy</title>

<meta name="theme-color"
content="#2563EB">

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/admin/settings.css">

<link rel="stylesheet" href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

    <!-- Sidebar -->

    <aside
    class="sidebar"
    id="adminSidebar">
</aside>

    <!-- Main -->

    <main class="main-content">

        <header class="topbar">

            <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="font-weight: 700; font-size: 1.25rem; color: #111827;">ISSA Academy</span>
        </div>
    </div>

            <div>

                <h1>

                    Academy Settings

                </h1>

                <p>

                    Manage academy information.

                </p>

            </div>

        </header>

        <form

            id="settingsForm"

            class="settings-card">

            <div class="grid">

                <div class="form-group">

                    <label>

                        Academy Name

                    </label>

                    <input

                        id="academyName"

                        type="text"

                        placeholder="ISSA Academy">

                </div>

                <div class="form-group">

                    <label>

                        WhatsApp Number

                    </label>

                    <input

                        id="whatsapp"

                        type="text"

                        placeholder="9665XXXXXXXX">

                </div>

                <div class="form-group">

                    <label>

                        Email

                    </label>

                    <input

                        id="email"

                        type="email">

                </div>

                <div class="form-group">

                    <label>

                        Website

                    </label>

                    <input

                        id="website"

                        type="url">

                </div>

                <div class="form-group">

                    <label>

                        Address

                    </label>

                    <textarea

                        id="address"

                        rows="4">

                    </textarea>

                </div>

                <div class="form-group">

                    <label>

                        Currency

                    </label>

                    <select id="currency">

                        <option value="SAR">

                            SAR

                        </option>

                        <option value="INR">

                            INR

                        </option>

                        <option value="USD">

                            USD

                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        Facebook

                    </label>

                    <input

                        id="facebook"

                        type="url">

                </div>

                <div class="form-group">

                    <label>

                        Instagram

                    </label>

                    <input

                        id="instagram"

                        type="url">

                </div>

                <div class="form-group">

                    <label>

                        YouTube

                    </label>

                    <input

                        id="youtube"

                        type="url">

                </div>

                <div class="form-group">

                    <label>

                        LinkedIn

                    </label>

                    <input

                        id="linkedin"

                        type="url">

                </div>

            </div>

            <hr>

<hr class="section-divider">

<h2 class="section-title">

    Certificate Settings

</h2>

<div class="grid">

    <div class="form-group">

        <label>

            Certificate Prefix

        </label>

        <input
            id="certificatePrefix"
            type="text"
            placeholder="ISSA">

    </div>

    <div class="form-group">

        <label>

            Instructor Name

        </label>

        <input
            id="instructorName"
            type="text"
            placeholder="Mohammed Arshad">

    </div>

    <div class="form-group">

        <label>

            Instructor Designation

        </label>

        <input
            id="instructorDesignation"
            type="text"
            placeholder="Founder & Trainer">

    </div>

    <div class="form-group">

        <label>

            Certificate Logo URL

        </label>

        <input
            id="certificateLogo"
            type="url">

    </div>

    <div class="form-group">

        <label>

            Signature Image URL

        </label>

        <input
            id="signatureImage"
            type="url">

    </div>

</div>

            <div class="actions">

                <button

                    class="btn btn-primary"

                    type="submit">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Settings

                </button>

            </div>

        </form>

    </main>

</div>

<div

id="pageLoader"

class="page-loader hidden">

<div class="loader-card">

<img

src="../assets/images/Issa-Logo.png"

class="loader-logo">

<div class="loader-spinner"></div>

<p>

Saving Settings...

</p>

</div>

</div>

<div

id="toastContainer"

class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script

type="module"

src="../assets/js/admin/settings.js">

</script>

</body>

</html>
