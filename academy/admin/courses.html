<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Courses | ISSA Academy</title>

    <link rel="icon"
          href="../assets/images/Issa-Logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../assets/css/main.css">

    <link rel="stylesheet"
          href="../assets/css/admin/courses.css">

          <link rel="stylesheet" href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

    <aside
    class="sidebar"
    id="adminSidebar">
</aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Courses</h1>

                <p>Manage all academy courses.</p>

            </div>

            <a
                href="add-course.html"
                class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>

                Add Course

            </a>

        </header>

        <section class="toolbar">

            <input
                type="search"
                id="searchInput"
                placeholder="Search courses...">

            <select id="statusFilter">

                <option value="all">

                    All Courses

                </option>

                <option value="published">

                    Published

                </option>

                <option value="draft">

                    Draft

                </option>

            </select>

        </section>

        <section
            id="coursesGrid"
            class="courses-grid">

        </section>

                <!-- ================= Empty State ================= -->

        <div
            id="emptyState"
            class="empty-state hidden">

            <i class="fa-solid fa-book-open"></i>

            <h2>

                No Courses Found

            </h2>

            <p>

                Start by creating your first course.

            </p>

            <a
                href="add-course.html"
                class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>

                Add Course

            </a>

        </div>

        <!-- ================= Course Card Template ================= -->

        <template id="courseCardTemplate">

            <article class="course-card">

                <div class="course-image">

                    <img
                        class="thumbnail"
                        src="../assets/images/course-placeholder.jpg"
                        alt="Course">

                </div>

                <div class="course-content">

                    <div class="course-header">

                        <h3 class="course-title">

                        </h3>

                        <span class="course-status">

                        </span>

                    </div>

                    <p class="course-category">

                    </p>

                    <p class="course-description">

                    </p>

                    <div class="course-meta">

                        <span class="lesson-count">

                            <i class="fa-solid fa-video"></i>

                            <span class="lessons">

                                0

                            </span>

                            Lessons

                        </span>

                        <span class="student-count">

                            <i class="fa-solid fa-users"></i>

                            <span class="students">

                                0

                            </span>

                            Students

                        </span>

                    </div>

                    <div class="course-actions">

                        <button
                            class="btn-edit">

                            <i class="fa-solid fa-pen"></i>

                            Edit

                        </button>

                        <button
                            class="btn-publish">

                            Publish

                        </button>

                        <button
                            class="btn-delete">

                            Delete

                        </button>

                    </div>

                </div>

            </article>

        </template>

    </main>

</div>

<!-- ================= Loader ================= -->

<div
    id="pageLoader"
    class="page-loader hidden">

    <div class="loader-card">

        <img
            src="../assets/images/Issa-Logo.png"
            alt="ISSA Academy">

        <div class="loader-spinner"></div>

        <p>

            Loading Courses...

        </p>

    </div>

</div>

<!-- ================= Toast ================= -->

<div
    id="toastContainer"
    class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
    type="module"
    src="../assets/js/admin/courses.js">

</script>

</body>

</html>
