<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Lessons | ISSA Academy</title>

    <link rel="icon"
          href="../assets/images/Issa-Logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../assets/css/main.css">

    <link rel="stylesheet"
          href="../assets/css/admin/lessons.css">

          <link rel="stylesheet" href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

    <aside
    class="sidebar"
    id="adminSidebar">
</aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>

                    Lessons

                </h1>

                <p>

                    Manage all lessons.

                </p>

            </div>

            <a
                href="add-lesson.html"
                class="btn btn-primary">

                <i class="fa-solid fa-plus"></i>

                Add Lesson

            </a>

        </header>

        <section class="toolbar">

            <input
                type="search"
                id="searchInput"
                placeholder="Search lessons...">

            <select
                id="courseFilter">

                <option value="all">

                    All Courses

                </option>

            </select>

            <select
                id="moduleFilter">

                <option value="all">

                    All Modules

                </option>

            </select>

        </section>

        <section
            id="lessonsGrid"
            class="lessons-grid">

        </section>

        <div
            id="emptyState"
            class="empty-state hidden">

            <i class="fa-solid fa-video"></i>

            <h2>

                No Lessons Found

            </h2>

            <p>

                Create your first lesson.

            </p>

        </div>

    </main>

</div>

<!-- ================= Lesson Card Template ================= -->

<template id="lessonCardTemplate">

    <article class="lesson-card">

        <div class="lesson-header">

            <div>

                <h3 class="lesson-title"></h3>

                <span class="lesson-module"></span>

            </div>

            <span class="lesson-order"></span>

        </div>

        <div class="lesson-meta">

            <!-- Duration & Video Type removed -->

        </div>

        <div class="lesson-actions">

            <button class="btn-edit">

                <i class="fa-solid fa-pen"></i>

                Edit

            </button>

            <button class="btn-delete">

                <i class="fa-solid fa-trash"></i>

                Delete

            </button>

        </div>

    </article>

</template>

<!-- ================= Loader ================= -->

<div
    id="pageLoader"
    class="page-loader hidden">

    <div class="loader-card">

        <img
            src="../assets/images/Issa-Logo.png"
            alt="ISSA Academy">

        <div class="loader-spinner"></div>

        <p>

            Loading Lessons...

        </p>

    </div>

</div>

<!-- ================= Toast ================= -->

<div
    id="toastContainer"
    class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
    type="module"
    src="../assets/js/admin/lessons.js">

</script>

</body>

</html>
