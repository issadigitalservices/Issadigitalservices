<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Lesson | ISSA Academy</title>

    <link rel="icon"
          href="../assets/images/Issa-Logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../assets/css/main.css">

    <link rel="stylesheet"
          href="../assets/css/admin/add-lesson.css">

          <link rel="stylesheet" href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

    <aside
    class="sidebar"
    id="adminSidebar">
</aside>

    <main class="main-content">

        <header class="topbar">

            <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="font-weight: 700; font-size: 1.25rem; color: #111827;">ISSA Academy</span>
        </div>
    </div>

            <div>

                <h1>

                    Add Lesson

                </h1>

                <p>

                    Create a lesson for a module.

                </p>

            </div>

        </header>

        <form
            id="lessonForm"
            class="form-card">

            <div class="form-row">

                <div class="form-group">

                    <label>

                        Course

                    </label>

                    <select
                        id="courseId"
                        required>

                        <option value="">

                            Select Course

                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        Module

                    </label>

                    <select
                        id="moduleId"
                        required>

                        <option value="">

                            Select Module

                        </option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label>

                    Lesson Title

                </label>

                <input
                    type="text"
                    id="lessonTitle"
                    required>

            </div>

            <div class="form-group">

                <label>

                    Description

                </label>

                <textarea
                    id="lessonDescription"
                    rows="5">

                </textarea>

            </div>

            <div class="form-row">

                <div class="form-group">

                    <label>Lesson Video</label>

<input
    type="file"
    id="videoFile"
    accept="video/mp4,video/webm,video/mov"
    required>

<div class="upload-progress">

    <progress
        id="uploadProgress"
        value="0"
        max="100"></progress>

    <span id="uploadPercent">0%</span>

</div>

<div class="form-group">

    <label>Practice Excel File</label>

    <input
        type="file"
        id="practiceFile"
        accept=".xlsx,.xls">

    <small>
        Upload the Excel practice file for this lesson.
    </small>

</div>

<input
    type="hidden"
    id="videoUrl">

                </div>

            </div>

            <div class="form-group">

    <label>

        Lesson Order

    </label>

    <input
        type="number"
        id="lessonOrder"
        min="1"
        value="1">

</div>

            <button
                type="submit"
                class="btn btn-primary">

                <i class="fa-solid fa-floppy-disk"></i>

                Save Lesson

            </button>

        </form>

    </main>

</div>



<!-- ================= Loader ================= -->

<div
    id="pageLoader"
    class="page-loader hidden">

    <div class="loader-card">

        <img
            src="../assets/images/Issa-Logo.png"
            alt="ISSA Academy">

        <div class="loader-spinner"></div>

        <p>

            Saving Lesson...

        </p>

    </div>

</div>

<!-- ================= Toast ================= -->

<div
    id="toastContainer"
    class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
    type="module"
    src="../assets/js/admin/add-lesson.js">

</script>

</body>

</html>
