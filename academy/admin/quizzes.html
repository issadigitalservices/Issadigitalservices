<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quizzes | ISSA Academy</title>

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/admin/quizzes.css">

<link rel="stylesheet"
href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

<!-- ================= Sidebar ================= -->

<aside
    class="sidebar"
    id="adminSidebar">
</aside>

<!-- ================= Main ================= -->

<main class="main-content">

<header class="topbar">

<div>

<h1>

Quiz Management

</h1>

<p>

Manage Module Quizzes & Final Exams.

</p>

</div>

<a
href="quiz-form.html"
class="btn btn-primary">

<i class="fa-solid fa-plus"></i>

Add Quiz

</a>

</header>

<!-- ================= Toolbar ================= -->

<section class="toolbar">

<input
type="search"
id="searchInput"
placeholder="Search quiz...">

<select id="courseFilter">

<option value="all">

All Courses

</option>

</select>

<select id="typeFilter">

<option value="all">

All Types

</option>

<option value="module">

Module Quiz

</option>

<option value="final">

Final Exam

</option>

</select>

<select id="statusFilter">

<option value="all">

All Status

</option>

<option value="published">

Published

</option>

<option value="draft">

Draft

</option>

</select>

</section>

<!-- ================= Quiz Grid ================= -->

<section
id="quizGrid"
class="quiz-grid">

</section>

<!-- ================= Empty State ================= -->

<div
id="emptyState"
class="empty-state hidden">

<i class="fa-solid fa-circle-question"></i>

<h2>

No Quizzes Found

</h2>

<p>

Create your first quiz.

</p>

<a
href="quiz-form.html"
class="btn btn-primary">

<i class="fa-solid fa-plus"></i>

Add Quiz

</a>

</div>

<!-- ================= Quiz Card Template ================= -->

<template id="quizCardTemplate">

<article class="quiz-card">

<div class="quiz-header">

<div>

<h3 class="quiz-title">

</h3>

<span class="quiz-course">

</span>

</div>

<span class="quiz-status">

</span>

</div>

<div class="quiz-body">

<div class="quiz-item">

<i class="fa-solid fa-layer-group"></i>

<span class="quiz-module">

</span>

</div>

<div class="quiz-item">

<i class="fa-solid fa-list-check"></i>

<span class="quiz-type">

</span>

</div>

<div class="quiz-item">

<i class="fa-solid fa-clock"></i>

<span class="quiz-duration">

</span>

</div>

<div class="quiz-item">

<i class="fa-solid fa-circle-question"></i>

<span class="quiz-questions">

</span>

</div>

<div class="quiz-item">

<i class="fa-solid fa-percent"></i>

<span class="quiz-passmark">

</span>

</div>

</div>

<div class="quiz-actions">

<button class="btn-edit">

<i class="fa-solid fa-pen"></i>

Edit

</button>

<button class="btn-questions">

<i class="fa-solid fa-list"></i>

Questions

</button>

<button class="btn-delete">

<i class="fa-solid fa-trash"></i>

Delete

</button>

</div>

</article>

</template>

</main>

</div>

<!-- ================= Loader ================= -->

<div
id="pageLoader"
class="page-loader hidden">

<div class="loader-card">

<img
src="../assets/images/Issa-Logo.png"
alt="ISSA Academy">

<div class="loader-spinner">

</div>

<p>

Loading Quizzes...

</p>

</div>

</div>

<!-- ================= Toast ================= -->

<div
id="toastContainer"
class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
type="module"
src="../assets/js/admin/quizzes.js">

</script>

</body>

</html>
