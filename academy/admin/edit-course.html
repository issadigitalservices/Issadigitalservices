<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Course | ISSA Academy</title>

    <link rel="icon"
          href="../assets/images/Issa-Logo.png">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet"
          href="../assets/css/main.css">

    <link rel="stylesheet"
          href="../assets/css/admin/edit-course.css">

<link rel="stylesheet" href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

    <aside
    class="sidebar"
    id="adminSidebar">
</aside>

    <main class="main-content">

        <header class="topbar">

            <div>

                <h1>Edit Course</h1>

                <p>Update course information.</p>

            </div>

            <a href="courses.html"
               class="btn btn-secondary">

                <i class="fa-solid fa-arrow-left"></i>

                Back

            </a>

        </header>

        <form id="courseForm"
              class="form-card">

            <div class="form-grid">

                <div class="form-group">

                    <label>

                        Course Title

                    </label>

                    <input
                        id="title"
                        type="text"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Category

                    </label>

                    <input
                        id="category"
                        type="text"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Price (₹)

                    </label>

                    <input
                        id="price"
                        type="number"
                        required>

                </div>

                <div class="form-group">

                    <label>

                        Duration

                    </label>

                    <input
                        id="duration"
                        type="text">

                </div>

                <div class="form-group">

                    <label>

                        Level

                    </label>

                    <select id="level">

                        <option>Beginner</option>

                        <option>Intermediate</option>

                        <option>Advanced</option>

                    </select>

                </div>

                <div class="form-group">

                    <label>

                        Status

                    </label>

                    <select id="status">

                        <option value="draft">

                            Draft

                        </option>

                        <option value="published">

                            Published

                        </option>

                    </select>

                </div>

            </div>

            <div class="form-group">

                <label>

                    Description

                </label>

                <textarea
                    id="description"
                    rows="6">

                </textarea>

            </div>

            <div class="form-group">

                <label>

                    Thumbnail

                </label>

                <input
                    id="thumbnail"
                    type="file"
                    accept="image/*">

            </div>

            <div class="form-actions">

                <button
                    class="btn btn-primary"
                    type="submit">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Course

                </button>

            </div>

        </form>

    </main>

</div>

<div
    id="pageLoader"
    class="page-loader hidden">

    <div class="loader-card">

        <img
            src="../assets/images/Issa-Logo.png"
            alt="ISSA Academy">

        <div class="loader-spinner"></div>

        <p>

            Updating...

        </p>

    </div>

</div>

<div
    id="toastContainer"
    class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
    type="module"
    src="../assets/js/admin/edit-course.js">

</script>

</body>

</html>
