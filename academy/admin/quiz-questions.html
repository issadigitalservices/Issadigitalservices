<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Quiz Questions | ISSA Academy</title>

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/admin/quiz-questions.css">

<link rel="stylesheet"
href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

<aside
    class="sidebar"
    id="adminSidebar">
</aside>

<main class="main-content">

<header class="topbar">

<div>

<h1 id="quizTitle">

Quiz Questions

</h1>

<p>

Manage quiz questions.

</p>

</div>

<a
href="quizzes.html"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</header>

<form
id="questionForm"
class="form-card">

<div class="form-group">

<label>

Question

</label>

<textarea
id="question"
rows="4"
required>

</textarea>

</div>

<div class="form-group">

<label>

Question Attachment (Optional)

</label>

<input
id="questionAttachment"
type="file"
accept=".xlsx,.xls,.csv,.pdf,.doc,.docx,.ppt,.pptx,.jpg,.jpeg,.png,.zip">

<small>

Supported files:
Excel, PDF, Word, PowerPoint, Images and ZIP (Maximum 10 MB)

</small>

<div
id="attachmentPreview"
class="attachment-preview">

</div>

</div>

<div class="grid">

<div class="form-group">

<label>

Option A

</label>

<input
id="optionA"
type="text"
required>

</div>

<div class="form-group">

<label>

Option B

</label>

<input
id="optionB"
type="text"
required>

</div>

<div class="form-group">

<label>

Option C

</label>

<input
id="optionC"
type="text"
required>

</div>

<div class="form-group">

<label>

Option D

</label>

<input
id="optionD"
type="text"
required>

</div>

<div class="form-group">

<label>

Correct Answer

</label>

<select
id="correctAnswer">

<option value="A">

A

</option>

<option value="B">

B

</option>

<option value="C">

C

</option>

<option value="D">

D

</option>

</select>

</div>

<div class="form-group">

<label>

Marks

</label>

<input
id="marks"
type="number"
value="1"
min="1">

</div>

</div>

<div class="form-group">

<label>

Explanation

</label>

<textarea
id="explanation"
rows="3">

</textarea>

</div>

<div class="actions">

<button
id="saveBtn"
type="submit"
class="btn btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

<span id="saveBtnText">

Save Question

</span>

</button>

</div>

</form>

<section
id="questionsList"
class="questions-list">

</section>

</main>

</div>

<div
id="pageLoader"
class="page-loader hidden">

<div class="loader-card">

<img
src="../assets/images/Issa-Logo.png">

<div class="loader-spinner">

</div>

<p>

Loading Questions...

</p>

</div>

</div>

<div
id="toastContainer"
class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
type="module"
src="../assets/js/admin/quiz-questions.js">

</script>

</body>

</html>
