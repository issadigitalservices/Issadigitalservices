<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Exams | ISSA Academy</title>

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/admin/exams.css">

<link rel="stylesheet"
href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

<!-- ================= Sidebar ================= -->

<aside
    class="sidebar"
    id="adminSidebar">
</aside>

<!-- ================= Main ================= -->

<main class="main-content">

<header class="topbar">

    <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="font-weight: 700; font-size: 1.25rem; color: #111827;">ISSA Academy</span>
        </div>
    </div>

<div>

<h1>

Exam Management

</h1>

<p>

Manage Module Exams & Final Exams.

</p>

</div>

<a
href="exam-form.html"
class="btn btn-primary">

<i class="fa-solid fa-plus"></i>

Add Exam

</a>

</header>

<!-- ================= Toolbar ================= -->

<section class="toolbar">

<input
type="search"
id="searchInput"
placeholder="Search exam...">

<select id="courseFilter">

<option value="all">

All Courses

</option>

</select>

<select id="typeFilter">

<option value="all">

All Types

</option>

<option value="module">

Module Exam

</option>

<option value="final">

Final Exam

</option>

</select>

</section>

<!-- ================= Exam Grid ================= -->

<section
id="examGrid"
class="exam-grid">

</section>

<!-- ================= Empty State ================= -->

<div
id="emptyState"
class="empty-state hidden">

<i class="fa-solid fa-circle-question"></i>

<h2>

No Exams Found

</h2>

<p>

Create your first exam.

</p>

<a
href="exam-form.html"
class="btn btn-primary">

<i class="fa-solid fa-plus"></i>

Add Exam

</a>

</div>

<!-- ================= Exam Card Template ================= -->

<template id="examCardTemplate">

<article class="exam-card">

<div class="exam-header">

<div>

<h3 class="exam-title">

</h3>

<span class="exam-course">

</span>

</div>

</div>

<div class="exam-body">

<div class="exam-item">

<i class="fa-solid fa-layer-group"></i>

<span class="exam-module">

</span>

</div>

<div class="exam-item">

<i class="fa-solid fa-list-check"></i>

<span class="exam-type">

</span>

</div>

<div class="exam-item">

<i class="fa-solid fa-clock"></i>

<span class="exam-duration">

</span>

</div>

<div class="exam-item">

<i class="fa-solid fa-circle-question"></i>

<span class="exam-questions">

</span>

</div>

<div class="exam-item">

<i class="fa-solid fa-percent"></i>

<span class="exam-passmark">

</span>

</div>

</div>

<div class="exam-actions">

<button class="btn-edit">

<i class="fa-solid fa-pen"></i>

Edit

</button>

<button class="btn-questions">

<i class="fa-solid fa-list"></i>

Questions

</button>

<button class="btn-delete">

<i class="fa-solid fa-trash"></i>

Delete

</button>

</div>

</article>

</template>

</main>

</div>

<!-- ================= Loader ================= -->

<div
id="pageLoader"
class="page-loader hidden">

<div class="loader-card">

<img
src="../assets/images/Issa-Logo.png"
alt="ISSA Academy">

<div class="loader-spinner">

</div>

<p>

Loading Exams...

</p>

</div>

</div>

<!-- ================= Toast ================= -->

<div
id="toastContainer"
class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
type="module"
src="../assets/js/admin/exams.js">

</script>

</body>

</html>
