<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Quiz | ISSA Academy</title>

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/admin/quiz-form.css">

<link rel="stylesheet"
href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

<aside
class="sidebar"
id="adminSidebar">
</aside>

<main class="main-content">

<header class="topbar">

    <div style="display: flex; align-items: center; gap: 1rem;">
        <button id="sidebarToggle" class="sidebar-toggle-btn" aria-label="Toggle Sidebar">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div style="display: flex; align-items: center; gap: 0.75rem;">
            <span style="font-weight: 700; font-size: 1.25rem; color: #111827;">ISSA Academy</span>
        </div>
    </div>

<div>

<h1>

Add Quiz

</h1>

<p>

Create Module Quiz or Final Exam

</p>

</div>

<a
href="quizzes.html"
class="btn btn-secondary">

<i class="fa-solid fa-arrow-left"></i>

Back

</a>

</header>

<form
id="quizForm"
class="form-card">

<div class="grid">

<div class="form-group">

<label>

Course

</label>

<select
id="courseId"
required>

<option value="">

Select Course

</option>

</select>

</div>

<div class="form-group">

<label>

Module

</label>

<select
id="moduleId"
required>

<option value="">

Select Module

</option>

</select>

<small id="moduleHelp">

Required for Module Quiz only.

</small>

</div>

<div class="form-group">

<label>

Quiz Title

</label>

<input
id="quizTitle"
type="text"
required>

</div>

<div class="form-group">

<label>

Quiz Type

</label>

<select
id="quizType">

<option value="module">

Module Quiz

</option>

<option value="final">

Final Exam

</option>

</select>

</div>

<div class="form-group">

<label>

Duration (Minutes)

</label>

<input
id="duration"
type="number"
min="1"
value="30"
required>

</div>

<div class="form-group">

<label>

Total Questions

</label>

<input
id="totalQuestions"
type="number"
min="1"
value="10"
required>

</div>

<div class="form-group">

<label>

Pass Percentage

</label>

<input
id="passMark"
type="number"
min="1"
max="100"
value="70"
required>

</div>

</div>

<div class="actions">

<button
type="submit"
class="btn btn-primary">

<i class="fa-solid fa-floppy-disk"></i>

Save Quiz

</button>

</div>

</form>

</main>

</div>

<div
id="pageLoader"
class="page-loader hidden">

<div class="loader-card">

<img
src="../assets/images/Issa-Logo.png">

<div class="loader-spinner">

</div>

<p>

Saving Quiz...

</p>

</div>

</div>

<div
id="toastContainer"
class="toast-container">

</div>

<script
src="../assets/js/admin/admin-sidebar.js">
</script>

<script
type="module"
src="../assets/js/admin/quiz-form.js">
</script>

</body>

</html>
