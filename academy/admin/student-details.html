<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Details | ISSA Academy</title>

<link rel="icon"
href="../assets/images/Issa-Logo.png">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link rel="stylesheet"
href="../assets/css/main.css">

<link rel="stylesheet"
href="../assets/css/admin/student-details.css">

<link rel="stylesheet" href="../assets/css/layout/admin-layout.css">

</head>

<body>

<div class="admin-layout">

<aside
    class="sidebar"
    id="adminSidebar">
</aside>

<main class="main-content">

<header class="topbar">

<div>

<h1>

Student Details

</h1>

<p>

Complete student information.

</p>

</div>

</header>

<div class="profile-card">

<div class="profile-left">

<img

id="studentPhoto"

src="../assets/images/default-avatar.png"

alt="Student">

<h2 id="studentName">

Loading...

</h2>

<p id="studentEmail">

</p>

<p id="studentMobile">

</p>

<div class="status">

<span id="studentStatus">

Active

</span>

</div>

</div>

<div class="profile-right">

<div class="info-grid">

<div>

<label>

Registered On

</label>

<p id="registeredDate">

-

</p>

</div>

<div>

<label>

Purchased Courses

</label>

<p id="courseCount">

0

</p>

</div>

<div>

<label>

Completed Courses

</label>

<p id="completedCount">

0

</p>

</div>

<div>

<label>

Certificates

</label>

<p id="certificateCount">

0

</p>

</div>

</div>

</div>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">

<div class="card-header">

<h2>

Purchased Courses

</h2>

</div>

<div

id="courseList"

class="card-body">

</div>

</div>

<div class="dashboard-card">

<div class="card-header">

<h2>

Payment History

</h2>

</div>

<div

id="paymentList"

class="card-body">

</div>

</div>

</div>

<div class="dashboard-grid">

<div class="dashboard-card">

<div class="card-header">

<h2>

Certificates

</h2>

</div>

<div

id="certificateList"

class="card-body">

</div>

</div>

<div class="dashboard-card">

<div class="card-header">

<h2>

Actions

</h2>

</div>

<div class="card-body action-buttons">

<button

id="whatsappBtn"

class="btn btn-success">

<i class="fa-brands fa-whatsapp"></i>

WhatsApp

</button>

<button

id="emailBtn"

class="btn btn-primary">

<i class="fa-solid fa-envelope"></i>

Email

</button>

<button

id="disableBtn"

class="btn btn-danger">

<i class="fa-solid fa-user-slash"></i>

Disable Student

</button>

</div>

</div>

</div>

</main>

</div>

<div
id="pageLoader"
class="page-loader hidden">

<div class="loader-card">

<img
src="../assets/images/Issa-Logo.png"
class="loader-logo">

<div class="loader-spinner"></div>

<p>

Loading Student...

</p>

</div>

</div>

<div
id="toastContainer"
class="toast-container">

</div>

<script
    src="../assets/js/admin/admin-sidebar.js">
</script>

<script
type="module"
src="../assets/js/admin/student-details.js">

</script>

</body>

</html>
